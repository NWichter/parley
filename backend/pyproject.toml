[project]
name = "backend"
version = "0.1.0"
description = "Parley API"

requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
